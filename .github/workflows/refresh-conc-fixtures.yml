name: Refresh ConC Soccer fixtures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'
  schedule:
    - cron: "0 3,9,15,21 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch today's real fixtures from SportScore
        run: python scripts/fetch_fixtures.py
      - name: Fetch recent completed results for team form
        run: python scripts/fetch_team_history.py
      - name: Check public forecast source availability
        run: python scripts/fetch_source_predictions.py
      - name: Calculate model probabilities
        run: python scripts/build_predictions.py
      - name: Publish fixture and prediction data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fixtures.json docs/data/team_history.json docs/data/predictions.json docs/data/source_predictions.json
          git diff --cached --quiet || (git commit -m "Refresh ConC Soccer live fixtures" && git push)
